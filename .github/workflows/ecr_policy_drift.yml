name: ECR lifecycle policy drift

# ECR のライフサイクルポリシーは CloudFormation の管理外にあるため、コンソールから
# 手動で変更されても誰も気づけない。2026-09-19 の本番停止は、まさにその手動設定の
# ルール優先度が原因だった（docs/ecr-lifecycle.md）。
# ここでは ecr/ 配下の正本と AWS の現行設定がずれていないかだけを見る。適用はしない。

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - 'ecr/**'
      - 'scripts/ecr-lifecycle.mjs'
      - '.github/workflows/ecr_policy_drift.yml'
  schedule:
    # 毎週月曜 09:00 JST。手動変更を長く放置しないための保険。
    - cron: '0 0 * * 1'
  workflow_dispatch:

env:
  AWS_ROLE_ARN: arn:aws:iam::887442827229:role/GithubActions_decidim-cfj-cdk

jobs:
  drift:
    name: check drift
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: aws switch role
        uses: aws-actions/configure-aws-credentials@v1
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - name: Check lifecycle policy drift
        run: npm run ecr:policy:diff
